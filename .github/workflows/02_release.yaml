name: 02 release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad #v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Create settings.xml
        uses: s4u/maven-settings-action@4cfd36368400327fd45dcb28f190ae7b85533deb #v4.1.0
        with:
          repositories: '[{"id": "xerces","name": "github","url": "https://maven.pkg.github.com/navikt/xerces-xmlschema-1.1"}]'
          servers: '[{{"id": "xerces", "username": "${{ github.actor }}", "password": "${{ secrets.GITHUB_TOKEN }}"}]'

      - name: Configure git user
        run: |
          git config user.name "GitHub Actions Bot (${ACTOR})"
          git config user.email "actions@github.com"
        env:
          ACTOR: ${{ github.actor }}

      - name: Publish
        run: |
          mvn --batch-mode deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: report to slack
        if: always()
        uses: navikt/eresept-actions/slack-notify@main
        with:
          status: "${{ job.status }}"
          username: "release ${{ env.appver }}"
          icon: ":github:"
          title-success: "Successfully released ${{ github.event.repository.name }}"
          title-failure: "Release of ${{ github.event.repository.name }} failed"
          title-cancelled: "Release of ${{ github.event.repository.name }} was cancelled"
          message-success: "Successfully released _*${{ github.event.repository.name }}*_"
          webhook: ${{ secrets.SLACK_WEBHOOK }}
